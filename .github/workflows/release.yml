name: Release

on:
  push:
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Calcium-Ion/AstrLink'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate tag and signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun apps/desktop/scripts/release-updates.mjs version "$RELEASE_TAG"
          bun apps/desktop/scripts/release-updates.mjs preflight

  macos:
    needs: validate
    uses: ./.github/workflows/macos-package.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  windows:
    needs: validate
    uses: ./.github/workflows/windows-package.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  linux:
    needs: validate
    uses: ./.github/workflows/linux-package.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: AstrLink-*
          path: artifacts
      - name: Verify all platforms and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: bun apps/desktop/scripts/release-updates.mjs publish artifacts release "$RELEASE_TAG"
